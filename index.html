<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Text:ital@0;1&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
<script src="./image-slot.js"></script>
<style>
  html, body { margin:0; padding:0; background:oklch(0.934 0.02 6); }
  * { box-sizing:border-box; }
  a { color:oklch(0.42 0.09 17); text-decoration:none; }
  a:hover { color:oklch(0.32 0.1 17); }
  image-slot::part(frame) { background:transparent; }
  @keyframes cvFloat { 0%, 100% { transform:translateY(0px); } 50% { transform:translateY(-10px); } }
  @keyframes cvMorph { 0%, 100% { transform:scale(1,1) skew(0deg,0deg); } 33% { transform:scale(1.08,0.92) skew(2deg,1deg); } 66% { transform:scale(0.93,1.07) skew(-2deg,-1deg); } }
  @keyframes cvBgDrift { 0%, 100% { transform:translate(0,0); } 50% { transform:translate(3%,-2%); } }
  @keyframes cvGlow {
    0% { opacity:0.6; transform:scale(1); }
    8% { opacity:0.95; transform:scale(1.04); }
    17% { opacity:0.68; transform:scale(1.01); }
    29% { opacity:1; transform:scale(1.07); }
    38% { opacity:0.72; transform:scale(1.02); }
    52% { opacity:0.9; transform:scale(1.05); }
    61% { opacity:0.62; transform:scale(1); }
    74% { opacity:1; transform:scale(1.06); }
    85% { opacity:0.7; transform:scale(1.01); }
    100% { opacity:0.6; transform:scale(1); }
  }
  @media (max-width: 700px) {
    [data-role="cv-title"], [data-role="cv-desc"] { width:calc(100vw - 56px) !important; }
    [data-role="cv-imggroup"] { left:16px !important; right:16px !important; top:2% !important; bottom:16% !important; }
    [data-role="cv-desc"] { bottom:70px !important; }
    [data-role="cv-blob-left"] { left:-10% !important; }
    [data-role="cv-blob-right"] { right:-10% !important; }
  }
  @media (min-width: 1024px) and (max-width: 1440px) {
    [data-role="cv-imggroup"] { left:min(220px, 18vw) !important; right:min(220px, 18vw) !important; }
    [data-role="cv-blob-left"] img, [data-role="cv-blob-right"] img { transform:scale(0.6); }
  }
  @media (min-width: 1441px) {
    [data-role="cv-blob-right-inner"] { margin-top:6%; }
  }
  @media (min-width: 1024px) {
    [data-role="cv-desc"] { width:min(460px, 32vw) !important; bottom:28px !important; }
    [data-role="cv-yearnav"] { justify-content:flex-end !important; }
  }
  [data-role="cv-rotate-msg"] { display:none; }
  @media (max-height: 500px) and (orientation: landscape) {
    [data-role="cv-title"], [data-role="cv-desc"], [data-role="cv-imggroup"], [data-role="cv-blob-left"], [data-role="cv-blob-right"], [data-role="cv-yearnav"] { display:none !important; }
    [data-role="cv-rotate-msg"] { display:flex !important; }
  }
</style>
</helmet>
<div style="position:relative; width:100%; min-height:100vh; height:100vh; overflow:hidden; background:oklch(0.934 0.02 6); font-family:'DM Sans', Helvetica, sans-serif; color:oklch(0.22 0.015 20); user-select:none">

  <sc-for list="{{ entries }}" as="e" hint-placeholder-count="1">
    <div style="position:absolute; inset:0; overflow:hidden; z-index:0">
      <div style="position:absolute; inset:-10%; background:{{ e.bg }}; opacity:{{ e.bgOp }}; transition:opacity 500ms ease; animation:cvBgDrift 16s ease-in-out infinite"></div>
    </div>
  </sc-for>

  <div data-role="cv-rotate-msg" style="position:absolute; inset:0; align-items:center; justify-content:center; text-align:center; padding:0 32px; z-index:60; background:oklch(0.934 0.02 6); font-family:'DM Sans', sans-serif; font-size:18px; letter-spacing:0.02em; color:oklch(0.22 0.015 20)">
    Rotate your phone to portrait
  </div>

  <div style="position:absolute; left:0; right:0; top:0; height:56px; display:grid; grid-template-columns:50% 50%; align-items:center; padding:0 28px; z-index:40">
    <a href="https://paultinker.uk" style="font-family:'DM Sans', sans-serif; font-size:16px; letter-spacing:0.02em; color:{{ themeText }}">← Back to home</a>
    <div style="text-align:right; font-family:'DM Sans', sans-serif; font-size:14px; letter-spacing:0.16em; text-transform:uppercase; opacity:0.62; color:{{ themeText }}">PAUL TINKER CV / BUILT WITH AI</div>
  </div>

  <div style="position:absolute; left:0; right:0; top:56px; bottom:0; overflow:hidden">

    <sc-for list="{{ entries }}" as="e" hint-placeholder-count="1">
      <div style="position:absolute; inset:0; pointer-events:{{ e.pe }}">

        <sc-if value="{{ e.showBlobs }}" hint-placeholder-val="{{ false }}">
          <div data-role="cv-blob-left" style="position:absolute; left:2%; top:calc(50% - ({{ e.blobLeftH }})/2 - 10%); width:{{ e.blobLeftW }}; height:{{ e.blobLeftH }}; z-index:2; opacity:{{ e.blobOp }}">
            <div style="width:100%; height:100%; transform:translateX({{ e.blobDx }}); transition:transform 900ms cubic-bezier(.16,1,.3,1)">
              <div style="width:100%; height:100%; transform:translate({{ e.blobLeftPx }}, {{ e.blobLeftPy }}); transition:transform 300ms ease-out">
                <div style="width:100%; height:100%; animation:cvMorph 12s ease-in-out infinite">
                  <img src="./assets/blob-left.svg" style="width:100%; height:100%; object-fit:contain" />
                </div>
              </div>
            </div>
          </div>
          <div data-role="cv-blob-right" style="position:absolute; right:9%; top:calc(50% - ({{ e.blobRightH }})/2 + 10%); width:{{ e.blobRightW }}; height:{{ e.blobRightH }}; z-index:2; opacity:{{ e.blobOp }}">
            <div style="width:100%; height:100%; transform:translateX({{ e.blobDx }}); transition:transform 900ms cubic-bezier(.16,1,.3,1)">
              <div style="width:100%; height:100%; transform:translate({{ e.blobRightPx }}, {{ e.blobRightPy }}); transition:transform 300ms ease-out">
                <div data-role="cv-blob-right-inner" style="width:100%; height:100%; animation:cvMorph 15s ease-in-out infinite; animation-delay:1400ms">
                  <img src="./assets/blob-right.svg" style="width:100%; height:100%; object-fit:contain" />
                </div>
              </div>
            </div>
          </div>
        </sc-if>

        <div data-role="cv-imggroup" style="position:absolute; left:{{ e.groupLeft }}; right:{{ e.groupRight }}; top:{{ e.groupTop }}; bottom:{{ e.groupBottom }}; pointer-events:{{ e.pe }}; z-index:{{ e.imgZ }}">
          <sc-if value="{{ e.wide4 }}" hint-placeholder-val="{{ false }}">
            <div style="position:absolute; left:13%; top:20%; width:28%; height:38%; transform:translateX({{ e.images.0.dx }}); transition:transform 820ms cubic-bezier(.3,0,.2,1) {{ e.images.0.delay }}ms">
              <div style="width:100%; height:100%; transform:translate({{ e.images.0.px }}, {{ e.images.0.py }}); transition:transform 300ms ease-out">
                <div style="width:100%; height:100%; animation:cvFloat 5.2s ease-in-out infinite; animation-delay:0ms">
                  <image-slot id="{{ e.images.0.id }}" shape="rounded" radius="4" fit="contain" placeholder="{{ e.images.0.hint }}"></image-slot>
                </div>
              </div>
            </div>
            <div style="position:absolute; left:48%; top:9%; width:23%; height:44%; transform:translateX({{ e.images.2.dx }}); transition:transform 820ms cubic-bezier(.3,0,.2,1) {{ e.images.2.delay }}ms">
              <div style="width:100%; height:100%; transform:translate({{ e.images.2.px }}, {{ e.images.2.py }}); transition:transform 300ms ease-out">
                <div style="width:100%; height:100%; animation:cvFloat 4.6s ease-in-out infinite; animation-delay:600ms">
                  <image-slot id="{{ e.images.2.id }}" shape="rounded" radius="4" fit="contain" placeholder="{{ e.images.2.hint }}"></image-slot>
                </div>
              </div>
            </div>
            <div style="position:absolute; left:11%; top:32%; width:45%; height:50%; transform:translateX({{ e.images.1.dx }}); transition:transform 820ms cubic-bezier(.3,0,.2,1) {{ e.images.1.delay }}ms">
              <div style="width:100%; height:100%; transform:translate({{ e.images.1.px }}, {{ e.images.1.py }}); transition:transform 300ms ease-out">
                <div style="width:100%; height:100%; animation:cvFloat 5.8s ease-in-out infinite; animation-delay:1100ms">
                  <image-slot id="{{ e.images.1.id }}" shape="rounded" radius="4" fit="contain" placeholder="{{ e.images.1.hint }}"></image-slot>
                </div>
              </div>
            </div>
            <div style="position:absolute; left:64%; top:19%; width:22%; height:46%; transform:translateX({{ e.images.3.dx }}); transition:transform 820ms cubic-bezier(.3,0,.2,1) {{ e.images.3.delay }}ms">
              <div style="width:100%; height:100%; transform:translate({{ e.images.3.px }}, {{ e.images.3.py }}); transition:transform 300ms ease-out">

                  <image-slot id="{{ e.images.3.id }}" shape="rounded" radius="4" fit="contain" placeholder="{{ e.images.3.hint }}"></image-slot>

              </div>

              <div style="width:100%; height:100%; transform:translate({{ e.images.0.px }}, {{ e.images.0.py }}); transition:transform 300ms ease-out">
                <div style="width:100%; height:100%; animation:{{ e.imgFloat }}; animation-delay:0ms">
                  <image-slot id="{{ e.images.0.id }}" shape="rounded" radius="4" fit="contain" placeholder="{{ e.images.0.hint }}"></image-slot>
                </div>
              </div>
            </div>
            <div style="position:absolute; z-index:2; left:{{ e.img3.l1 }}; top:7.5%; width:{{ e.img3.w1 }}; height:85%; transform:translateX({{ e.images.1.dx }}); transition:transform 820ms cubic-bezier(.3,0,.2,1) {{ e.images.1.delay }}ms">
              <div style="width:100%; height:100%; transform:translate({{ e.images.1.px }}, {{ e.images.1.py }}); transition:transform 300ms ease-out">
                <div style="width:100%; height:100%; animation:{{ e.imgFloat }}; animation-delay:500ms">
                  <image-slot id="{{ e.images.1.id }}" shape="rounded" radius="4" fit="contain" placeholder="{{ e.images.1.hint }}"></image-slot>
                </div>
              </div>
            </div>
            <div style="position:absolute; left:{{ e.img3.l2 }}; top:7.5%; width:{{ e.img3.w2 }}; height:85%; transform:translateX({{ e.images.2.dx }}); transition:transform 820ms cubic-bezier(.3,0,.2,1) {{ e.images.2.delay }}ms">
              <div style="width:100%; height:100%; transform:translate({{ e.images.2.px }}, {{ e.images.2.py }}); transition:transform 300ms ease-out">
                <div style="width:100%; height:100%; animation:{{ e.imgFloat }}; animation-delay:1000ms">
                  <image-slot id="{{ e.images.2.id }}" shape="rounded" radius="4" fit="contain" placeholder="{{ e.images.2.hint }}"></image-slot>
                </div>
              </div>
            </div>
          </sc-if>
          <sc-if value="{{ e.wide1 }}" hint-placeholder-val="{{ false }}">
            <div style="position:absolute; left:50%; top:50%; width:min(84%, 92vh); aspect-ratio:16/9; transform:translate(-50%,-50%) translateX({{ e.images.0.dx }}); transition:transform 820ms cubic-bezier(.3,0,.2,1) {{ e.images.0.delay }}ms">
              <div style="position:absolute; inset:-26%; border-radius:20px; background:radial-gradient(ellipse, oklch(0.85 0.01 90 / 1) 0%, oklch(0.85 0.01 90 / 0) 68%); filter:blur(30px); animation:cvGlow 5.2s ease-in-out infinite; z-index:0"></div>
              <div style="position:absolute; inset:0; z-index:1; border-radius:8px; overflow:hidden; box-shadow:0 0 70px 12px oklch(0.55 0.15 252 / 0.5)">
                <sc-if value="{{ e.hasVideo }}" hint-placeholder-val="{{ false }}">
                  <canvas ref="{{ e.videoRef }}" style="position:absolute; inset:0; width:100%; height:100%"></canvas>
                </sc-if>
                <sc-if value="{{ e.noVideo }}" hint-placeholder-val="{{ true }}">
                  <image-slot id="{{ e.images.0.id }}" shape="rounded" radius="8" fit="cover" placeholder="{{ e.images.0.hint }}"></image-slot>
                </sc-if>
              </div>
            </div>
          </sc-if>
          <sc-if value="{{ e.wide5 }}" hint-placeholder-val="{{ true }}">
            <div style="position:absolute; left:0; top:0; width:56%; height:100%; transform:translateX({{ e.images.0.dx }}); transition:transform 820ms cubic-bezier(.3,0,.2,1) {{ e.images.0.delay }}ms">
              <image-slot id="{{ e.images.0.id }}" shape="rounded" radius="4" fit="contain" placeholder="{{ e.images.0.hint }}"></image-slot>
            </div>
            <div style="position:absolute; left:58%; top:0; width:20%; height:48%; transform:translateX({{ e.images.1.dx }}); transition:transform 820ms cubic-bezier(.3,0,.2,1) {{ e.images.1.delay }}ms">
              <image-slot id="{{ e.images.1.id }}" shape="rounded" radius="4" fit="contain" placeholder="{{ e.images.1.hint }}"></image-slot>
            </div>
            <div style="position:absolute; left:80%; top:0; width:20%; height:48%; transform:translateX({{ e.images.2.dx }}); transition:transform 820ms cubic-bezier(.3,0,.2,1) {{ e.images.2.delay }}ms">
              <image-slot id="{{ e.images.2.id }}" shape="rounded" radius="4" fit="contain" placeholder="{{ e.images.2.hint }}"></image-slot>
            </div>
            <div style="position:absolute; left:58%; top:52%; width:20%; height:48%; transform:translateX({{ e.images.3.dx }}); transition:transform 820ms cubic-bezier(.3,0,.2,1) {{ e.images.3.delay }}ms">
              <image-slot id="{{ e.images.3.id }}" shape="rounded" radius="4" fit="contain" placeholder="{{ e.images.3.hint }}"></image-slot>
            </div>
            <div style="position:absolute; left:80%; top:52%; width:20%; height:48%; transform:translateX({{ e.images.4.dx }}); transition:transform 820ms cubic-bezier(.3,0,.2,1) {{ e.images.4.delay }}ms">
              <image-slot id="{{ e.images.4.id }}" shape="rounded" radius="4" fit="contain" placeholder="{{ e.images.4.hint }}"></image-slot>
            </div>
          </sc-if>
        </div>

        <div style="position:absolute; left:28px; top:12px; width:min(340px, 34vw); padding:14px 0; border-radius:6px; z-index:20; color:{{ e.textColor }}; transition:opacity 520ms ease 120ms, transform 620ms cubic-bezier(.16,1,.3,1) 120ms; opacity:{{ e.textOp }}; transform:translateY({{ e.ty }})" data-role="cv-title">
          <div style="font-family:'DM Serif Text', serif; font-weight:700; font-size:clamp(26px, 3.2vw, 46px); letter-spacing:0; line-height:1.03; text-wrap:balance">{{ e.company }}</div>
          <div style="margin-top:8px; font-family:'DM Sans', sans-serif; font-size:16px; font-weight:500; letter-spacing:-0.01em; opacity:0.75">{{ e.title }}</div>
          <div style="margin-top:6px; font-size:15px; line-height:1.55; font-family:'DM Sans', sans-serif; opacity:0.55">{{ e.meta }}</div>
        </div>

        <div style="position:absolute; left:28px; bottom:96px; width:min(340px, 30vw); z-index:20; transition:opacity 420ms ease; opacity:{{ e.descOp }}" data-role="cv-desc">
          <div style="font-size:15px; line-height:1.55; text-wrap:pretty; color:{{ e.descColor }}">{{ e.desc }}</div>
          <sc-if value="{{ e.showLink }}" hint-placeholder-val="{{ true }}">
            <a href="{{ e.link }}" target="_blank" rel="noopener" style="display:inline-block; margin-top:14px; font-family:'DM Sans', sans-serif; font-size:11px; letter-spacing:0.16em; text-transform:uppercase; color:{{ e.linkColor }}; border-bottom:1px solid {{ e.linkColor }}; padding-bottom:2px">{{ e.linkLabel }} ↗</a>
          </sc-if>
        </div>
      </div>
    </sc-for>
  </div>

  <div data-role="cv-yearnav" style="position:absolute; left:0; right:0; bottom:0; height:64px; display:flex; align-items:center; gap:2px; padding:0 28px; overflow-x:auto; z-index:40">
    <sc-for list="{{ entries }}" as="e" hint-placeholder-count="8">
      <button onClick="{{ e.select }}" style="flex:0 0 auto; border:none; background:{{ e.navBg }}; border-radius:999px; cursor:pointer; padding:10px 18px; font-family:'DM Sans', sans-serif; font-size:12px; letter-spacing:0.1em; color:{{ e.navColor }}; transition:opacity 200ms ease, background 200ms ease; font-weight:{{ e.navWeight }}; opacity:{{ e.navOp }}" style-hover="opacity:1">{{ e.short }}</button>
    </sc-for>
  </div>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script>

  }
};

class Component extends DCLogic {
  state = { i: 0, info: true };

  componentDidMount() {
    this._key = (ev) => {
      if (ev.key === "ArrowRight" || ev.key === "ArrowDown") { ev.preventDefault(); this.go(1); }
      if (ev.key === "ArrowLeft" || ev.key === "ArrowUp") { ev.preventDefault(); this.go(-1); }
    };
    this._wheel = (ev) => {
      const d = Math.abs(ev.deltaX) > Math.abs(ev.deltaY) ? ev.deltaX : ev.deltaY;
      if (Math.abs(d) < 8) return;
      const now = Date.now();
      if (this._last && now - this._last < 520) return;
      this._last = now;
      this.go(d > 0 ? 1 : -1);
    };
    window.addEventListener("keydown", this._key);
    window.addEventListener("wheel", this._wheel, { passive: true });
    this._mouse = (ev) => {
      this.setState({
        mx: ev.clientX / window.innerWidth - 0.5,
        my: ev.clientY / window.innerHeight - 0.5
      });
    };
    window.addEventListener("mousemove", this._mouse);
  }

  componentWillUnmount() {
    window.removeEventListener("keydown", this._key);
    window.removeEventListener("wheel", this._wheel);
    window.removeEventListener("mousemove", this._mouse);
  }

  _startVideo(canvas, src) {
    if (!canvas || canvas._videoStarted) return;
    canvas._videoStarted = true;
    (async () => {
      try {
        const resp = await fetch(src);
        const buf = await resp.arrayBuffer();
        const decoder = new ImageDecoder({ data: buf, type: "image/webp" });
        await decoder.tracks.ready;
        const frameCount = decoder.tracks.selectedTrack.frameCount;
        const ctx = canvas.getContext("2d");
        let i = 0;
        const drawFrame = async () => {
          if (!canvas.isConnected) return;
          const result = await decoder.decode({ frameIndex: i });
          const image = result.image;
          if (canvas.width !== image.displayWidth) {
            canvas.width = image.displayWidth;
            canvas.height = image.displayHeight;
          }
          ctx.drawImage(image, 0, 0);
          const dur = image.duration || 40000;
          image.close();
          i = (i + 1) % frameCount;
          canvas._timer = setTimeout(drawFrame, dur / 1000);
        };
        drawFrame();
      } catch (err) {
        console.warn("video playback failed", err);
      }
    })();
  }

  go(step) {
    this.setState((s) => {
      const n = DATA.length;
      const i = Math.min(n - 1, Math.max(0, s.i + step));
      return { i };
    });
  }

  renderVals() {
    const active = this.state.i;
    const info = this.state.info;
    const strength = 0.55;
    const activeTheme = DATA[active].dark ? THEME.dark : THEME.light;
    const entries = DATA.map((d, i) => {
      const on = i === active;
      const theme = d.dark ? THEME.dark : THEME.light;
      return {
        year: d.year,
        short: d.short,
        company: d.company,
        title: d.title,
        meta: d.meta,
        desc: d.desc,
        link: d.link,
        linkLabel: d.linkLabel,
        showLink: !!d.link,
        slotId: "cv-" + i,
        slotHint: d.slot,
        images: Array.from({ length: d.imageCount || 5 }, (_, n) => {
          const count = d.imageCount || 5;
          const leaving = i < active;
          // Tiles nearest the direction of travel lead (feel fastest/closest):
          // entering/exiting left uses left-most tiles first, right uses right-most.
          const rank = leaving ? (count - 1 - n) : n;
          const factor = 1 + rank * 0.16;
          const dx = on
            ? "0%"
            : (leaving
                ? "calc(" + (-100 * factor) + "% - " + (100 * factor) + "vw)"
                : "calc(" + (100 * factor) + "% + " + (100 * factor) + "vw)");
          const depth = [18, 10, 10, 16][n] || 12;
          const mx = this.state.mx || 0, my = this.state.my || 0;
          const px = (mx * depth).toFixed(1) + "px";
          const py = (my * depth * 0.6).toFixed(1) + "px";
          return { id: "cv-" + i + "-" + n, hint: n === 0 ? d.slot : "photo " + (n + 1), dx, delay: n * 60, px, py, src: n === 0 ? (d.videoSrc || "") : "" };
        }),
        hasVideo: !!d.videoSrc,
        noVideo: !d.videoSrc,
        videoRef: (el) => this._startVideo(el, d.videoSrc),
        imgFloat: d.float ? "cvFloat 5.2s ease-in-out infinite" : "none",
        showBlobs: !!d.blobs,
        blobOp: 1,
        blobColor: d.blobColor || "oklch(0.72 0.1 145)",
        blobLeftW: "min(" + Math.round(320 * (d.blobScale || 1)) + "px, " + Math.round(28 * (d.blobScale || 1)) + "vw)",
        blobLeftH: Math.round(56 * (d.blobScale || 1)) + "%",
        blobRightW: "min(" + Math.round(300 * (d.blobRightScale || d.blobScale || 1)) + "px, " + Math.round(26 * (d.blobRightScale || d.blobScale || 1)) + "vw)",
        blobRightH: Math.round(50 * (d.blobRightScale || d.blobScale || 1)) + "%",
        blobDx: on ? "0px" : (i < active ? "calc(-100vw - 100%)" : "calc(100vw + 100%)"),
        blobLeftPx: ((this.state.mx || 0) * 26).toFixed(1) + "px",
        blobLeftPy: ((this.state.my || 0) * 16).toFixed(1) + "px",
        blobRightPx: ((this.state.mx || 0) * 34).toFixed(1) + "px",
        blobRightPy: ((this.state.my || 0) * 20).toFixed(1) + "px",
        img3: d.thirdBig
          ? { l0: "5.8%", w0: "25.4%", l1: "28.2%", w1: "19%", l2: "50.2%", w2: "44%" }
          : { l0: "2.4%", w0: "27.2%", l1: "33.4%", w1: "27.2%", l2: "64.4%", w2: "27.2%" },
        wide1: (d.imageCount || 5) === 1,
        wide3: (d.imageCount || 5) === 3,
        wide4: (d.imageCount || 5) === 4,
        wide5: (d.imageCount || 5) === 5,
        bg: d.bg || "oklch(0.934 0.02 6)",
        bgOp: on ? 1 : 0,
        textColor: theme.text,
        descColor: theme.desc,
        linkColor: theme.link,
        navColor: activeTheme.nav,
        groupLeft: "min(400px, 40vw)",
        groupRight: "min(400px, 40vw)",
        groupTop: (d.imageCount || 5) === 4 ? "3%" : "9%",
        groupBottom: (d.imageCount || 5) === 4 ? "3%" : "9%",
        numFont: d.year.length > 3 ? "23vw" : "26vw",
        numOp: on ? strength : 0,
        pe: on ? "auto" : "none",
        dx: on ? "0px" : (i < active ? "-9vw" : "9vw"),
        imgZ: on ? 5 : 1,
        textOp: on ? 1 : 0,
        ty: on ? "0px" : "14px",
        descOp: on && info ? 1 : 0,
        navOp: on ? 1 : 0.68,
        navWeight: on ? 700 : 400,
        navBg: on ? (d.navBg || theme.pillBg) : "transparent",
        select: () => this.setState({ i })
      };
    });
    return {
      entries,
      spanLabel: "PAUL TINKER",
      numeralOpacity: strength,
      prev: () => this.go(-1),
      next: () => this.go(1),
      toggleInfo: () => this.setState((s) => ({ info: !s.info })),
      themeText: activeTheme.nav,
      themePillBg: activeTheme.pillBg,
      themePillBgHover: activeTheme.pillBgHover,
      themePillText: activeTheme.pillText,
      themeIBorder: activeTheme.iBorder,
      themeIHoverBg: activeTheme.iHoverBg,
      themeIText: activeTheme.iText
    };
  }
}

</script>
</body>
